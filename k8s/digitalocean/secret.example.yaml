# Modelo do Secret. NÃO coloque a senha real aqui.
# Crie o Secret real direto no cluster (veja README do deploy), sem versionar:
#
#   DB_PASS=$(openssl rand -hex 16)
#   kubectl create secret generic encontros-tech-secret \
#     --from-literal=POSTGRES_USER=encontros_tech \
#     --from-literal=POSTGRES_PASSWORD="$DB_PASS" \
#     --from-literal=POSTGRES_DB=encontros_tech \
#     --from-literal=DATABASE_URL="postgresql://encontros_tech:${DB_PASS}@db:5432/encontros_tech"
apiVersion: v1
kind: Secret
metadata:
  name: encontros-tech-secret
  labels:
    app: encontros-tech
type: Opaque
stringData:
  POSTGRES_USER: encontros_tech
  POSTGRES_PASSWORD: TROCAR
  POSTGRES_DB: encontros_tech
  DATABASE_URL: postgresql://encontros_tech:TROCAR@db:5432/encontros_tech
