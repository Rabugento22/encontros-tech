apiVersion: v1
kind: ConfigMap
metadata:
  name: encontros-tech-config
  labels:
    app: encontros-tech
data:
  APP_TITLE: "Encontros Tech"
  DEBUG: "false"
  SERVICE_NAME: "encontros-tech"
  SERVICE_VERSION: "1.0.0"
---
# Credenciais de DESENVOLVIMENTO/TESTE (mesmas do docker-compose).
# Em ambientes reais, não versione este arquivo: use Sealed Secrets,
# External Secrets ou crie o Secret via `kubectl create secret`.
apiVersion: v1
kind: Secret
metadata:
  name: encontros-tech-secret
  labels:
    app: encontros-tech
type: Opaque
stringData:
  POSTGRES_USER: encontros_tech
  POSTGRES_PASSWORD: encontros_tech
  POSTGRES_DB: encontros_tech
  DATABASE_URL: postgresql://encontros_tech:encontros_tech@db:5432/encontros_tech
---
apiVersion: v1
kind: Service
metadata:
  name: db
  labels:
    app: encontros-tech-db
spec:
  clusterIP: None
  selector:
    app: encontros-tech-db
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
  labels:
    app: encontros-tech-db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels:
      app: encontros-tech-db
  template:
    metadata:
      labels:
        app: encontros-tech-db
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
              name: postgres
          envFrom:
            - secretRef:
                name: encontros-tech-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\" -d \"$POSTGRES_DB\""]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: pgdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: encontros-tech
  labels:
    app: encontros-tech
spec:
  replicas: 1
  selector:
    matchLabels:
      app: encontros-tech
  template:
    metadata:
      labels:
        app: encontros-tech
    spec:
      initContainers:
        # A app cria as tabelas no import; espera o Postgres aceitar conexões.
        - name: wait-for-db
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h db -p 5432; do echo aguardando db; sleep 2; done"]
      containers:
        - name: app
          image: rubensrsilva/encontros-tech-pos:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: encontros-tech-config
            - secretRef:
                name: encontros-tech-secret
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: encontros-tech
  labels:
    app: encontros-tech
spec:
  type: NodePort
  selector:
    app: encontros-tech
  ports:
    - name: http
      port: 8000
      targetPort: http
      nodePort: 30080
