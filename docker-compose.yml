services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: encontros_tech
      POSTGRES_PASSWORD: encontros_tech
      POSTGRES_DB: encontros_tech
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U encontros_tech -d encontros_tech"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    image: rubensrsilva/encontros-tech-pos
    build:
      context: ./src
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://encontros_tech:encontros_tech@db:5432/encontros_tech
      APP_TITLE: Encontros Tech
      DEBUG: "false"
      SERVICE_NAME: encontros-tech
      SERVICE_VERSION: 1.0.0
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
